name: CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".nvmrc"
      - "src/**"
      - "worker/**"
      - "db/**"
      - "tests/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "package.json"
      - ".nvmrc"
      - "src/**"
      - "worker/**"
      - "db/**"
      - "tests/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run monitor tests
        run: npm run test:monitor
      - name: Typecheck and build
        run: npm run build
